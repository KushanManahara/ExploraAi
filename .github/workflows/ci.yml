# .github/workflows/ci.yml
# CONTINUOUS INTEGRATION: LINT, FORMAT, TYPE CHECK, TEST AND BUILD FOR THE PYTHON AND WEB CODE.
# SECURITY RULES (PLAN §5, §10.1):
#   - READ-ONLY TOKEN, NO SECRETS, NO CACHES (AVOIDS CACHE POISONING).
#   - ONLY GITHUB-AUTHORED ACTIONS, EACH PINNED TO A FULL COMMIT SHA (VERIFIED AGAINST ITS RELEASE TAG).
#   - PNPM COMES FROM COREPACK (VERIFIES THE packageManager INTEGRITY HASH); UV IS HASH-PINNED FROM PYPI.
# SECURITY SCANNING: TRIVY FROM A VERIFIED RELEASE (SEE THE "security" JOB).

name: CI

on:
  push:
    branches: ["master", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # USE THE INTERPRETER FROM setup-python; NEVER DOWNLOAD ANOTHER ONE.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (version from .python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/ci/uv-requirements.txt"

      - name: Install dependencies (lockfile must be up to date)
        run: uv sync --all-packages --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy (strict)
        run: uv run --no-sync mypy

      - name: Pytest
        run: uv run --no-sync pytest

  web:
    name: Web (eslint, tsc, prettier, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pnpm via Corepack (pinned version and integrity hash from package.json)
        run: corepack enable

      - name: Install dependencies (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Prettier check
        run: pnpm format:check

      - name: Vitest
        run: pnpm test

      - name: Next.js production build
        run: pnpm build

  database:
    name: Database (migrations, RLS tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # SUPABASE CLI, PINNED BY THE SHA-256 PUBLISHED IN THE RELEASE checksums.txt (VERIFIED 2026-10-22).
      SUPABASE_CLI_VERSION: "2.121.0"
      SUPABASE_CLI_SHA256: "4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Supabase CLI (pinned release, SHA-256 verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o supabase.tar.gz "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  supabase.tar.gz" | sha256sum --check --strict -
          tar -xzf supabase.tar.gz supabase
          "$RUNNER_TEMP/supabase" --version

      - name: Start local database and apply migrations
        run: '"$RUNNER_TEMP/supabase" db start'

      - name: Run database tests (pgTAP, incl. row-level-security isolation)
        run: '"$RUNNER_TEMP/supabase" test db'

  security:
    name: Security (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # TRIVY v0.76.0, CHOSEN OVER v0.76.1 (RELEASED 2026-10-21, DEPENDENCY BUMPS ONLY) FOR A LONGER PUBLIC SOAK TIME.
      # THE SHA-256 IS OF THE EXACT TARBALL VERIFIED WITH COSIGN AGAINST ITS SIGSTORE BUNDLE ON 2026-10-22
      # (SIGNER: aquasecurity/trivy reusable-release.yaml @ refs/tags/v0.76.0). NEVER USE v0.69.4-v0.69.6 (CVE-2026-33634).
      TRIVY_VERSION: "0.76.0"
      TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (pinned release, SHA-256 verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict -
          tar -xzf trivy.tar.gz trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Scan new code (vulnerabilities incl. dev dependencies, misconfigurations; blocking on HIGH/CRITICAL)
        run: >-
          "$RUNNER_TEMP/trivy" fs --skip-version-check --disable-telemetry --no-progress
          --scanners vuln,misconfig --include-dev-deps --severity HIGH,CRITICAL
          --skip-dirs legacy --skip-dirs design
          --ignorefile .trivyignore.yaml --exit-code 1 .

      - name: Secret scan (entire repository incl. docs, tests and .env.example; blocking)
        run: >-
          "$RUNNER_TEMP/trivy" fs --skip-version-check --disable-telemetry --no-progress
          --scanners secret --secret-config trivy-secret.yaml --exit-code 1 .

      - name: Scan legacy/ (report-only, never blocks; plan decision D31)
        run: >-
          "$RUNNER_TEMP/trivy" fs --skip-version-check --disable-telemetry --no-progress
          --scanners vuln --severity HIGH,CRITICAL --exit-code 0 legacy
