<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio UI kit</title><link rel="stylesheet" href="../../styles.css"></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const KM = window.KushanManaharaDesignSystem_636c69;
const { NavBar, Home, ProjectsIndex, CaseStudy, PROJECTS, ChatWidget } = KM;
function App() {
  const [view, setView] = React.useState({ s: 'home' });
  const go = v => { setView(v); window.scrollTo(0, 0); };
  const open = p => go({ s: 'case', p });
  const i = view.p ? PROJECTS.indexOf(view.p) : 0, next = PROJECTS[(i + 1) % PROJECTS.length];
  return <div>
    {view.s === 'home' && <NavBar position="fixed" active="Projects" onNavigate={l => l === 'Projects' && go({ s: 'index' })} onCta={() => {}} />}
    {view.s === 'home' && <Home projects={PROJECTS} onOpen={open} onIndex={() => go({ s: 'index' })} />}
    {view.s === 'index' && <ProjectsIndex projects={PROJECTS} onBack={() => go({ s: 'home' })} onOpen={open} />}
    {view.s === 'case' && <CaseStudy p={view.p} next={next} onBack={() => go({ s: 'home' })} onNext={() => open(next)} />}
    <ChatWidget />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
