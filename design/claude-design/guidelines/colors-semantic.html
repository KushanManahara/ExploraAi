<!-- @dsCard group="Colors" viewport="700x200" subtitle="Semantic aliases" name="Semantic surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--bg-page);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--bg-page</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--bg-inverse);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--bg-inverse</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-card);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-card</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-card-rest);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-card-rest</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-soft);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-soft</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-tag);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-tag</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-glass);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-glass</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:9px;background:var(--surface-placeholder);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1);flex:none"></span><span style="font:500 11px/1.4 var(--font-mono);opacity:.6;opacity:.8">--surface-placeholder</span></div></div>
</body></html>
