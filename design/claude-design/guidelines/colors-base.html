<!-- @dsCard group="Colors" viewport="700x170" subtitle="Paper, ink, night — the three surfaces" name="Base palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-paper);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Paper</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-paper<br>#EEF1F7</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-ink);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Ink</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-ink<br>#0B1530</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-night);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Night</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-night<br>#070B16</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-white);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">White</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-white<br>#FFFFFF</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-mist);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Mist</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-mist<br>#DCE2EE</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-panel);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Panel</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-panel<br>#151E36</div></div></div>
</body></html>
