<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-accent);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Accent</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-accent<br>#4F6BFF</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-accent-deep);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Accent deep</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-accent-deep<br>#3651E0</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-accent-soft);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Accent soft</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-accent-soft<br>55% + white</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-accent-wash);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Accent wash</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-accent-wash<br>13% glow</div></div></div><div style="margin-top:14px;display:flex;gap:10px;align-items:center;font:500 11px/1.4 var(--font-mono);opacity:.6">Alt accents: <span style="width:14px;height:14px;border-radius:50%;background:#6D7CFF"></span>#6D7CFF <span style="width:14px;height:14px;border-radius:50%;background:#1E9BFF"></span>#1E9BFF</div>
</body></html>
