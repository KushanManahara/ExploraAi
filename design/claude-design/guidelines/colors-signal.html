<!-- @dsCard group="Colors" viewport="700x150" subtitle="Status only — never decorative" name="Signals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-signal);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Signal</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-signal<br>#5B8CFF</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-success);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Success</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-success<br>#2FBF71</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--km-warning);box-shadow:inset 0 0 0 1px rgba(11,21,48,.1)"></div><div style="font-weight:600;font-size:13px">Warning</div><div style="font:500 11px/1.4 var(--font-mono);opacity:.6">--km-warning<br>#FFB547</div></div></div>
</body></html>
