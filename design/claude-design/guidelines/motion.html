<!-- @dsCard group="Effects" viewport="700x170" subtitle="One house curve: cubic-bezier(.2,.8,.1,1)" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;font-family:var(--font-sans)}@keyframes m{to{left:calc(100% - 16px)}}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px"><span style="font:500 11px/1.4 var(--font-mono);opacity:.6">fast .3s</span><div style="height:8px;border-radius:99px;background:var(--km-ink-a08);position:relative"><span style="position:absolute;top:-4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--km-accent);animation:m 2.4s var(--ease-out) infinite alternate;animation-duration:calc(.3s * 6)"></span></div></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px"><span style="font:500 11px/1.4 var(--font-mono);opacity:.6">base .35s</span><div style="height:8px;border-radius:99px;background:var(--km-ink-a08);position:relative"><span style="position:absolute;top:-4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--km-accent);animation:m 2.4s var(--ease-out) infinite alternate;animation-duration:calc(.35s * 6)"></span></div></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px"><span style="font:500 11px/1.4 var(--font-mono);opacity:.6">slow .45s</span><div style="height:8px;border-radius:99px;background:var(--km-ink-a08);position:relative"><span style="position:absolute;top:-4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--km-accent);animation:m 2.4s var(--ease-out) infinite alternate;animation-duration:calc(.45s * 6)"></span></div></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px"><span style="font:500 11px/1.4 var(--font-mono);opacity:.6">lens .55s</span><div style="height:8px;border-radius:99px;background:var(--km-ink-a08);position:relative"><span style="position:absolute;top:-4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--km-accent);animation:m 2.4s var(--ease-out) infinite alternate;animation-duration:calc(.55s * 6)"></span></div></div></div>
</body></html>
